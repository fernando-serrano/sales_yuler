name: Sync sales data

on:
  workflow_dispatch:
    inputs:
      pipeline_run_date:
        description: "Fecha de corrida en formato YYYY-MM-DD"
        required: false
        type: string
      pipeline_lookback_days:
        description: "Cantidad de dias hacia atras para la ventana"
        required: false
        default: "3"
        type: string
  schedule:
    - cron: "0 10 * * *"

concurrency:
  group: sync-sales-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests

  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TARGET_SPREADSHEET_ID: ${{ secrets.TARGET_SPREADSHEET_ID }}
          TARGET_WORKSHEET_NAME: ${{ secrets.TARGET_WORKSHEET_NAME }}
          PIPELINE_RUN_DATE: ${{ inputs.pipeline_run_date || '' }}
          PIPELINE_LOOKBACK_DAYS: ${{ inputs.pipeline_lookback_days || '3' }}
        run: python -m sales_yuler run --mode append
